# .github/workflows/gcp-wif-demo.yml
# Lab 5.4: prove GitHub Actions can assume the GCP SA via WIF.
# No service-account JSON key is stored in this repo or in GitHub secrets.
name: gcp-wif-demo

on:
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

jobs:
  gcp-wif:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Authenticate to Google Cloud (WIF)
        uses: google-github-actions/auth@v2
        with:
          project_id: ${{ vars.GCP_PROJECT_ID }}
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SA_EMAIL }}

      - name: Setup gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Prove the token works (viewer)
        run: |
          gcloud auth list
          gcloud storage ls --project="${{ vars.GCP_PROJECT_ID }}"
